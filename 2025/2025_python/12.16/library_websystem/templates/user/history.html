<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歴確認画面</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
    <h1>履歴確認</h1>
    {% if not emps %}
        <p class="eroor_message">何も借りていません。</p>
    {% else %}
        <table>
            <tr>
                <th>本のタイトル</th>
            </tr>
            {% for emp in emps %}
            <tr>
                <td>{{emp[0]}}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}
    <a class="reverse_page" href="/user_menu">戻る</a>
</body>
</html>
