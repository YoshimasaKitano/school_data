<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本の検索結果画面</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
    <h1>検索結果</h1>

    {% if not emps %}
        <p>見つかりませんでした。</p>
    
    {% else %}
        <table>
            <tr>
                <th>タイトル</th>
                <th>著者名</th>
                <th>貸出可否</th>
            </tr>
            {% for emp in emps %}
            <tr>
                <td>{{emp[0]}}</td>
                <td>{{emp[1]}}</td>
                <td>
                    {% if emp[2] == true %}
                        可
                    {% else %}
                        不可
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table> 

    {% endif %}
    <p><a href="/">戻る</a></p>
</body>
</html>
