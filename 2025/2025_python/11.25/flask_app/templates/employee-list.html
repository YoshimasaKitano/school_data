<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    <h1>{{title}}</h1>
    <p>{{msg}}</p>

    <table>
        <tr>
            <th>従業員番号</th>
            <th>従業員名</th>
            <th>パスワード</th>
        </tr>

        {% for emp in emps %}

            <td>{{emp[0]}}</td>
            <td>{{emp[1]}}</td>
            <td>{{emp[2]}}</td>
        </tr>
        {% endfor %}
    </table>
    <p><a href="/">index ページへ</a></p>
</body>
</html>
